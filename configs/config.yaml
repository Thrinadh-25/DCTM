# DCTM – Central configuration
# Paths are relative to project root (c:/Users/Thrinadh reddy/DCTM)

project:
  root: "."
  seed: 42

paths:
  datasets:
    cicids2017: "datasets/cicids 2017"
    cicids2018: "datasets/cicids2018csv"
  processed: "data/processed"
  splits: "data/splits"
  models: "data/models"
  adversarial: "data/adversarial"
  scaler: "data/scaler.pkl"
  logs: "logs/run.log"
  results: "evaluation/results"
  visualization: "visualization"
  configs: "configs"

preprocessing:
  test_size: 0.2
  random_state: 42
  # For large datasets, optionally subsample before heavy ops (0 = no subsample)
  max_rows_per_file: 0
  drop_inf: true
  drop_nan: true
  drop_duplicates: true

smote:
  k_neighbors: 5
  random_state: 42
  # If any class has < min_samples, it will be skipped for SMOTE
  min_samples: 6
  # Cap per-class samples before SMOTE to avoid RAM blowup on large datasets.
  # 50k × 15 classes = 750k rows, fits CPU sklearn classifiers in a few minutes.
  max_samples_per_class: 50000

feature_engineering:
  baseline_top_k: 10
  dctm_top_k: 20
  mi_sample_size: 100000   # subsample to speed MI computation
  shap_sample_size: 50000  # subsample for SHAP background
  lgbm:
    n_estimators: 200
    learning_rate: 0.05
    num_leaves: 63
    random_state: 42

diffusion:
  timesteps: 1000
  beta_schedule: "linear"    # linear | cosine
  beta_start: 0.0001
  beta_end: 0.02
  cosine_s: 0.008
  model_dim: 256
  time_embed_dim: 128
  nhead: 4
  num_layers: 4
  dim_feedforward: 512
  dropout: 0.1
  epochs: 100
  batch_size: 256
  lr: 0.0001
  weight_decay: 0.0001
  grad_clip: 1.0
  partial_t_fraction: 0.5
  adv_samples_per_class: 5000

classical:
  decision_tree:
    max_depth: 25
    min_samples_split: 20
    min_samples_leaf: 10
    class_weight: "balanced"
    random_state: 42
  naive_bayes:
    var_smoothing: 0.00000001
  logistic_regression:
    solver: "saga"
    max_iter: 300
    n_jobs: -1
    class_weight: "balanced"
    C: 1.0
    random_state: 42
    # Subsample only this classifier (saga still scales to ~500k cleanly)
    max_train_samples: 300000
  random_forest:
    n_estimators: 200
    max_depth: 25
    min_samples_leaf: 5
    n_jobs: -1
    class_weight: "balanced_subsample"
    random_state: 42
  xgboost:
    n_estimators: 200
    max_depth: 8
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    objective: "multi:softprob"
    eval_metric: "mlogloss"
    tree_method: "hist"
    random_state: 42
  svm:
    kernel: "rbf"
    probability: true
    random_state: 42
    # SVM can be slow on huge data – subsample the training set
    max_train_samples: 50000

deep_learning:
  epochs: 30
  batch_size: 512
  lr: 0.001
  weight_decay: 0.0001
  patience: 10
  mlp:
    hidden: [256, 128, 64]
    dropout: 0.3
  cnn:
    channels: [32, 64]
    kernel_size: 3
    dropout: 0.3
  rnn:
    hidden_size: 128
    num_layers: 2
    dropout: 0.3
  cnn_bilstm:
    cnn_channels: 32
    lstm_hidden: 64
    dropout: 0.3

evaluation:
  demgan_reference_er: 0.9742
